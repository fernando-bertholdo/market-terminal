[project]
name = "Market Terminal"
description = "Terminal de mercado FICC (Bloomberg-style) + simulador quant de paper-trading"
version = "0.1.0"

[paths]
agents = "AGENTS.md"
skills = ".codex/skills"
rules = ".codex/rules"

[mcp_servers.chrome-devtools]
command = "npx"
args = ["-y", "chrome-devtools-mcp@latest"]

[features]
memory = true
traces = false

[settings]
max_context_tokens = 200000
prefer_markdown_links = true

# Perfis de sessão para lançar o Codex em modos recorrentes.
# Eles configuram a sessão principal; a orquestração de subagentes vive em
# `AGENTS.md` (raiz) e `.codex/skills/agent-team/SKILL.md`.

[profiles.research]
model_reasoning_effort = "high"
model_verbosity = "low"
approval_policy = "never"
sandbox_mode = "read-only"

[profiles.review]
model_reasoning_effort = "high"
model_verbosity = "low"
approval_policy = "never"
sandbox_mode = "read-only"

[profiles.implementation]
model_reasoning_effort = "medium"
model_verbosity = "medium"
approval_policy = "never"
sandbox_mode = "workspace-write"

[profiles.docs]
model_reasoning_effort = "medium"
model_verbosity = "medium"
approval_policy = "never"
sandbox_mode = "workspace-write"
