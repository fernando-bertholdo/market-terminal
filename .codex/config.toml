# O Codex só lê este arquivo com o projeto marcado como confiável no
# ~/.codex/config.toml (trust_level = "trusted"), e não inteiro: [profiles.*]
# ele ignora mesmo assim, com aviso (codex doctor --all), e o template não os
# versiona (C-1 da TECH-852).
# Já um [mcp_servers.*] ativo aqui ficaria habilitado para quem confiar no
# projeto, e por isso o template não versiona nenhum; quem quiser um o declara
# no próprio ~/.codex/config.toml, com versão fixa (pacote@<versão>, nunca
# @latest). Sem a marca este arquivo é inerte. Ver .codex/README.md, "O que o
# Codex lê deste repositório" (TECH-803, TECH-793).

[project]
name = "Market Terminal"
description = "Terminal de mercado FICC (Bloomberg-style) + simulador quant de paper-trading"
version = "0.1.0"

[paths]
agents = "AGENTS.md"
skills = ".agents/skills"
rules = ".codex/rules"

[features]
memory = true
traces = false

[settings]
max_context_tokens = 200000
prefer_markdown_links = true
